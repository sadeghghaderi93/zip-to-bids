[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-to-bids"
version = "0.1.0"
description = "A Google Colab workflow for converting ZIP-packed DICOM neuroimaging data into BIDS datasets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sadegh Ghaderi"}
]
dependencies = [
  "ipyfilechooser>=0.6.0",
  "ipywidgets>=8.1",
  "nibabel>=5.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-docx>=1.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
